name: Validate and build containers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:admin
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-browser-evidence
          path: .test-artifacts/admin
          retention-days: 3
  containers:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [game-server, control-plane]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          load: true
          tags: shootball/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify non-root startup, health and protected admin API
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' shootball/$IMAGE:$SHA)" = node
          docker run -d --name smoke -p 127.0.0.1:18080:8080 -p 127.0.0.1:12567:2567 \
            -e SUPABASE_URL=https://lkgxpgcmspxekggndzih.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_fixture shootball/$IMAGE:$SHA
          if [ "$IMAGE" = control-plane ]; then PORT=18080; else PORT=12567; fi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:$PORT/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:$PORT/healthz
          if [ "$IMAGE" = control-plane ]; then
            curl -fsS http://127.0.0.1:$PORT/admin/ | grep -q 'Control room'
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/admin/v1/dashboard?environment=gcp-test)" = 401
          fi
          docker stop --time 15 smoke
      - name: Container failure logs
        if: failure()
        run: docker logs smoke || true
