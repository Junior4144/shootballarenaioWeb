name: Deploy main to GCP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gcp-test-release
  cancel-in-progress: false
jobs:
  # Keep this caller path: the existing GCP trust policy pins workflow_ref to it.
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      id-token: write
    with:
      publish-images: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
    environment:
      name: gcp-test
      url: ${{ vars.WEB_BASE_URL }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Prepare scoped ephemeral CLI configuration
        shell: pwsh
        run: |
          ./scripts/gcloud.cmd help config configurations create
          ./scripts/gcloud.cmd config configurations create shootball-arena --no-activate --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Scoped configuration setup failed' }
      - name: Deploy and verify game VM release
        shell: pwsh
        env:
          GCP_DEPLOY_ENABLED: ${{ vars.GCP_DEPLOY_ENABLED }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.game-digest }}
        run: ./scripts/deploy-game-test.ps1 -ImageDigest $env:IMAGE_DIGEST
      - name: Deploy immutable web and admin revision
        shell: pwsh
        env:
          POSTHOG_API_KEY_SECRET_VERSION: ${{ vars.POSTHOG_API_KEY_SECRET_VERSION }}
          GCP_DEPLOY_ENABLED: ${{ vars.GCP_DEPLOY_ENABLED }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.control-digest }}
        run: ./scripts/deploy-control-test.ps1 -ImageDigest $env:IMAGE_DIGEST
      - name: Verify public site, protected admin API and multiplayer connection
        env:
          RELEASE_SHA: ${{ github.sha }}
          GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: node --import tsx scripts/smoke-live.mjs
