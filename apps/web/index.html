<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101923" />
    <title>ShootBall Arena - Shared Practice</title>
  </head>
  <body>
    <main>
      <header><div><p class="eyebrow">SHOOTBALL ARENA</p><h1>Target practice<span class="dot">.</span></h1></div><span class="badge">MULTIPLAYER PRACTICE</span></header>
      <div class="connection"><span id="connection-status" role="status" aria-live="polite">Connecting...</span><button id="join" hidden>Join / Retry</button><button id="leave" hidden>Leave</button></div>
      <div id="game" aria-label="ShootBall Arena. WASD to move, mouse to aim, left click to fire, R to reset the shared arena."></div>
      <footer><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move <b>&middot;</b> Mouse aim <b>&middot;</b> Left click fire</span><span><kbd>R</kbd> Reset shared arena</span></footer>
      <p class="note">Clear four shared targets together. Three hits each. R resets the room for everyone. Keyboard + mouse required.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
